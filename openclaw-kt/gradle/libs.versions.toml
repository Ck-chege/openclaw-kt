[versions]
kotlin = "2.3.0"
ktor = "3.1.1"
kotlinx-serialization = "1.10.0"
kotlinx-coroutines = "1.10.1"
kotlinx-datetime = "0.6.2"
exposed = "0.58.0"
postgresql = "42.7.5"
sqlite-jdbc = "3.51.0.0"
logback = "1.5.16"
kotlin-logging = "7.0.4"
kotest = "5.9.1"
clikt = "5.0.3"
kaml = "0.67.0"
typesafe-config = "1.4.3"
koog = "0.6.3"
jda = "5.3.0"
slack = "1.45.3"
telegram-bot = "8.0.0"
opentelemetry = "1.46.0"
testcontainers = "1.20.5"
jsoup = "1.18.3"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Kotlinx
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Ktor Server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-rate-limit = { module = "io.ktor:ktor-server-rate-limit", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# Ktor Client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# HTML Parsing
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Database
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

# Logging
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Config
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }

# CLI
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }

# YAML
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }

# Koog AI Agent Framework
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-agents-ext = { module = "ai.koog:agents-ext", version.ref = "koog" }
koog-agents-tools = { module = "ai.koog:agents-tools", version.ref = "koog" }
koog-agents-test = { module = "ai.koog:agents-test", version.ref = "koog" }
koog-executor-anthropic = { module = "ai.koog:prompt-executor-anthropic-client", version.ref = "koog" }
koog-executor-openai = { module = "ai.koog:prompt-executor-openai-client", version.ref = "koog" }
koog-executor-google = { module = "ai.koog:prompt-executor-google-client", version.ref = "koog" }
koog-executor-ollama = { module = "ai.koog:prompt-executor-ollama-client", version.ref = "koog" }
koog-executor-mistral = { module = "ai.koog:prompt-executor-mistralai-client", version.ref = "koog" }
koog-executor-openrouter = { module = "ai.koog:prompt-executor-openrouter-client", version.ref = "koog" }
koog-executor-deepseek = { module = "ai.koog:prompt-executor-deepseek-client", version.ref = "koog" }
koog-executor-llms-all = { module = "ai.koog:prompt-executor-llms-all", version.ref = "koog" }
koog-features-event-handler = { module = "ai.koog:agents-features-event-handler", version.ref = "koog" }
koog-features-snapshot = { module = "ai.koog:agents-features-snapshot", version.ref = "koog" }
koog-features-trace = { module = "ai.koog:agents-features-trace", version.ref = "koog" }
koog-agents-mcp = { module = "ai.koog:agents-mcp", version.ref = "koog" }

# Channels
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
slack-api-client = { module = "com.slack.api:slack-api-client", version.ref = "slack" }

# Testing
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

# Observability
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }

[bundles]
ktor-server = ["ktor-server-core", "ktor-server-netty", "ktor-server-websockets", "ktor-server-content-negotiation", "ktor-serialization-kotlinx-json"]
ktor-server-test = ["ktor-server-test-host"]
ktor-client = ["ktor-client-core", "ktor-client-cio", "ktor-client-content-negotiation"]
exposed = ["exposed-core", "exposed-jdbc", "exposed-json", "exposed-kotlin-datetime"]
kotest = ["kotest-runner-junit5", "kotest-assertions-core"]
logging = ["kotlin-logging", "logback-classic"]
koog = ["koog-agents", "koog-agents-ext", "koog-agents-tools", "koog-features-event-handler", "koog-features-snapshot"]
koog-executors = [
    "koog-executor-anthropic", "koog-executor-openai", "koog-executor-google",
    "koog-executor-ollama", "koog-executor-mistral", "koog-executor-openrouter",
    "koog-executor-deepseek", "koog-executor-llms-all"
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
shadow = { id = "com.gradleup.shadow", version = "9.0.0-beta8" }
